    <script>
      (() => {
        const retryParameter = '__pf_retry';

        window.addEventListener('error', (event) => {
          const failedScript = event.target;
          if (!(failedScript instanceof HTMLScriptElement) || !failedScript.src.includes('/assets/')) {
            return;
          }

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.has(retryParameter)) {
            return;
          }

          nextUrl.searchParams.set(retryParameter, Date.now().toString());
          window.location.replace(nextUrl.toString());
        }, true);

        window.addEventListener('load', () => {
          const currentUrl = new URL(window.location.href);
          if (!currentUrl.searchParams.has(retryParameter) || !document.getElementById('root')?.childElementCount) {
            return;
          }

          currentUrl.searchParams.delete(retryParameter);
          window.history.replaceState(window.history.state, '', currentUrl.toString());
        });
      })();
    </script>
